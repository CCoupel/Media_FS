# Exécution du projet en conteneur (Claude-Launcher-NG2) — versionné avec le projet
# Contenu proposé par /init-project (stack Go 1.25 / CGO cgofuse → libfuse) — complétable à la main, fusion additive à chaque /init-project d
image: docker.io/library/ubuntu:24.04
packages: [jq, pkg-config]   # paquets en plus (tmux, git, bash, sudo, curl : implicites)
packages_by_manager:         # cgo (gcc) + en-têtes libfuse (fuse2, cgofuse v1.6.0) + gh (labels / issues)
  apt: [build-essential, libfuse-dev, gh]
  dnf: [gcc, make, fuse-devel, gh]
  apk: [build-base, fuse-dev, github-cli]
setup:                       # étapes exécutées une fois, en utilisateur, dans le projet
  - |
    V=1.25.5; A=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
    [ "$(~/.local/go/bin/go env GOVERSION 2>/dev/null)" = "go$V" ] || { rm -rf ~/.local/go; curl -fsSL https://go.dev/dl/go$V.linux-$A.tar.gz | tar -xz -C ~/.local; }
    ln -sf ~/.local/go/bin/go ~/.local/go/bin/gofmt ~/.local/bin/
  - go mod download
watch: [go.sum]
# mounts: []                # dossiers en plus, ex. [{ path: ../autre, ro: true }]
